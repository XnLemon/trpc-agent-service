name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: ./scripts/format.sh --check

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.1.6

      - name: Lint
        run: ./scripts/lint.sh

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck (human-readable)
        id: govulncheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/govulncheck"
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.3 ./... 2>&1 | tee "$RUNNER_TEMP/govulncheck/results.txt"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Generate govulncheck SARIF
        id: govulncheck-sarif
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/govulncheck"
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.3 -format sarif ./... > "$RUNNER_TEMP/govulncheck/results.sarif"

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/govulncheck/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload dependency SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
        with:
          sarif_file: ${{ runner.temp }}/govulncheck/results.sarif
          category: dependency-vulnerability

      - name: Enforce dependency scan gate
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.govulncheck.outcome }}" != "success" ]]; then
            echo "::error::govulncheck reported a vulnerability or failed to complete (exit code ${{ steps.govulncheck.outputs.exit_code }})"
            exit 1
          fi
          if [[ "${{ steps.govulncheck-sarif.outcome }}" != "success" ]]; then
            echo "::error::govulncheck SARIF generation failed"
            exit 1
          fi

  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRPC_SERVICE_IMAGE: trpc-agent-service:ci-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build image and capture immutable digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          iidfile="$RUNNER_TEMP/trpc-service.iid"
          docker build --iidfile "$iidfile" --tag "$TRPC_SERVICE_IMAGE" .
          digest="$(<"$iidfile")"
          test -n "$digest"
          docker image inspect "$TRPC_SERVICE_IMAGE" >/dev/null
          docker save "$TRPC_SERVICE_IMAGE" --output "$RUNNER_TEMP/trpc-service.tar"
          {
            echo "### Container image under scan"
            echo
            echo "- Reference: $TRPC_SERVICE_IMAGE"
            echo "- Immutable image ID: $digest"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Scan image (human-readable)
        id: trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37
        with:
          scan-type: image
          input: ${{ runner.temp }}/trpc-service.tar
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

      - name: Generate image SARIF
        id: trivy-sarif
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37
        with:
          scan-type: image
          input: ${{ runner.temp }}/trpc-service.tar
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: sarif
          output: ${{ runner.temp }}/trivy-results.sarif
          limit-severities-for-sarif: true

      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Upload image SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
        with:
          sarif_file: ${{ runner.temp }}/trivy-results.sarif
          category: container-image

      - name: Enforce image scan gate
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.image.outcome }}" != "success" ]]; then
            echo "::error::container image build or digest capture failed"
            exit 1
          fi
          if [[ "${{ steps.trivy.outcome }}" != "success" ]]; then
            echo "::error::Trivy reported a HIGH or CRITICAL vulnerability or failed to complete"
            exit 1
          fi
          if [[ "${{ steps.trivy-sarif.outcome }}" != "success" ]]; then
            echo "::error::Trivy SARIF generation failed"
            exit 1
          fi

      - name: Remove local image
        if: always()
        shell: bash
        run: docker image rm "$TRPC_SERVICE_IMAGE" || true

  secret-scan:
    name: Commit Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Validate security allowlist expiry
        run: ./scripts/validate-security-allowlist.sh

      - name: Verify scanner pass/fail fixtures
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: ./scripts/security-secret-fixture.sh

      - name: Run commit secret scan
        id: gitleaks
        continue-on-error: true
        shell: bash
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
          GITLEAKS_REPORT: ${{ runner.temp }}/gitleaks-results.sarif
        run: |
          set -o pipefail
          set +e
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            "$GITLEAKS_BIN" git --redact --no-banner --config gitleaks.toml \
              --log-opts="$range" --report-format sarif --report-path "$GITLEAKS_REPORT" \
              2>&1 | tee "$RUNNER_TEMP/gitleaks-results.txt"
          else
            "$GITLEAKS_BIN" git --redact --no-banner --config gitleaks.toml \
              --log-opts="--all" --report-format sarif --report-path "$GITLEAKS_REPORT" \
              2>&1 | tee "$RUNNER_TEMP/gitleaks-results.txt"
          fi
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks-results.*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload secret SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@0fa1882f994fbd81a47ab0804f93354f5ea40147
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-results.sarif
          category: commit-secret

      - name: Enforce secret scan gate
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.gitleaks.outcome }}" != "success" ]]; then
            echo "::error::Gitleaks detected a secret or failed to complete (exit code ${{ steps.gitleaks.outputs.exit_code }})"
            echo "Rotate any exposed credential before requesting an exception."
            exit 1
          fi

  deployment:
    name: Deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRPC_SERVICE_IMAGE: trpc-agent-service:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment manifests
        run: ./scripts/validate-deployment.sh

      - name: Build container image
        run: docker build --tag "$TRPC_SERVICE_IMAGE" .

      - name: Run Compose smoke test
        run: |
          docker compose \
            --env-file deploy/example.env \
            -f deploy/docker-compose.yml \
            up -d --wait
          docker compose \
            --env-file deploy/example.env \
            -f deploy/docker-compose.yml \
            exec -T service /app/trpc-healthcheck http://127.0.0.1:8080/healthz
          docker compose \
            --env-file deploy/example.env \
            -f deploy/docker-compose.yml \
            exec -T service /app/trpc-healthcheck http://127.0.0.1:8080/readyz

      - name: Stop Compose services
        if: always()
        run: |
          docker compose \
            --env-file deploy/example.env \
            -f deploy/docker-compose.yml \
            down -v --remove-orphans || true

  build-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trpc_agent_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trpc_agent_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-repository:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trpc_agent_repository_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trpc_agent_repository_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-init:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trpc_agent_init_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trpc_agent_init_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: trpc_agent_mysql_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql-repository:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: trpc_agent_mysql_repository_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_MIGRATION_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/trpc_agent_migration_test?sslmode=disable
      POSTGRES_REPOSITORY_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5433/trpc_agent_repository_test?sslmode=disable
      POSTGRES_INIT_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5434/trpc_agent_init_test?sslmode=disable
      MYSQL_CONTROL_PLANE_MIGRATION_TEST_DSN: trpc_migration:mysql@tcp(127.0.0.1:3306)/trpc_agent_mysql_migration_test?parseTime=true&loc=UTC
      MYSQL_CONTROL_PLANE_REPOSITORY_MIGRATION_DSN: trpc_migration:mysql@tcp(127.0.0.1:3307)/trpc_agent_mysql_repository_test?parseTime=true&loc=UTC
      MYSQL_CONTROL_PLANE_TEST_DSN: trpc_app:mysql@tcp(127.0.0.1:3307)/trpc_agent_mysql_repository_test?parseTime=true&loc=UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Provision MySQL migration and application accounts
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -pmysql -e "
            SET GLOBAL log_bin_trust_function_creators = 1;
            CREATE USER IF NOT EXISTS 'trpc_migration'@'%' IDENTIFIED BY 'mysql';
            CREATE USER IF NOT EXISTS 'trpc_app'@'%' IDENTIFIED BY 'mysql';
            GRANT ALL PRIVILEGES ON trpc_agent_mysql_migration_test.* TO 'trpc_migration'@'%';
            FLUSH PRIVILEGES;"
          mysql --protocol=tcp -h 127.0.0.1 -P 3307 -uroot -pmysql -e "
            SET GLOBAL log_bin_trust_function_creators = 1;
            CREATE USER IF NOT EXISTS 'trpc_migration'@'%' IDENTIFIED BY 'mysql';
            CREATE USER IF NOT EXISTS 'trpc_app'@'%' IDENTIFIED BY 'mysql';
            GRANT ALL PRIVILEGES ON trpc_agent_mysql_repository_test.* TO 'trpc_migration'@'%';
            FLUSH PRIVILEGES;"
      - name: Prepare MySQL schemas and application grants
        run: |
          MYSQL_CONTROL_PLANE_MIGRATION_TEST_DSN="$MYSQL_CONTROL_PLANE_MIGRATION_TEST_DSN" \
            go test ./migrations -run '^TestMySQLControlPlaneMigrationLive$' -count=1
          MYSQL_CONTROL_PLANE_MIGRATION_TEST_DSN="$MYSQL_CONTROL_PLANE_REPOSITORY_MIGRATION_DSN" \
            go test ./migrations -run '^TestMySQLControlPlaneMigrationLive$' -count=1
          for table in tenant model_profile agent_app agent_app_revision agent_app_revision_tool backend_profile backend_profile_binding channel_binding tenant_status_change_outbox model_profile_change_outbox backend_profile_change_outbox agent_app_change_outbox channel_binding_change_outbox tenant_configuration_outbox; do
            mysql --protocol=tcp -h 127.0.0.1 -P 3307 -uroot -pmysql -e "GRANT SELECT, INSERT, UPDATE, DELETE ON trpc_agent_mysql_repository_test.${table} TO 'trpc_app'@'%';"
          done

      - name: Build
        run: ./scripts/build.sh

      - name: Coverage
        run: ./scripts/coverage.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Clean
        run: ./scripts/clean.sh

  race:
    name: Race Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trpc_agent_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trpc_agent_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-repository:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trpc_agent_repository_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trpc_agent_repository_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-init:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trpc_agent_init_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trpc_agent_init_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: trpc_agent_mysql_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql-repository:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: trpc_agent_mysql_repository_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_MIGRATION_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/trpc_agent_migration_test?sslmode=disable
      POSTGRES_REPOSITORY_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5433/trpc_agent_repository_test?sslmode=disable
      POSTGRES_INIT_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5434/trpc_agent_init_test?sslmode=disable
      MYSQL_CONTROL_PLANE_MIGRATION_TEST_DSN: trpc_migration:mysql@tcp(127.0.0.1:3306)/trpc_agent_mysql_migration_test?parseTime=true&loc=UTC
      MYSQL_CONTROL_PLANE_REPOSITORY_MIGRATION_DSN: trpc_migration:mysql@tcp(127.0.0.1:3307)/trpc_agent_mysql_repository_test?parseTime=true&loc=UTC
      MYSQL_CONTROL_PLANE_TEST_DSN: trpc_app:mysql@tcp(127.0.0.1:3307)/trpc_agent_mysql_repository_test?parseTime=true&loc=UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Provision MySQL migration and application accounts
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -pmysql -e "
            SET GLOBAL log_bin_trust_function_creators = 1;
            CREATE USER IF NOT EXISTS 'trpc_migration'@'%' IDENTIFIED BY 'mysql';
            CREATE USER IF NOT EXISTS 'trpc_app'@'%' IDENTIFIED BY 'mysql';
            GRANT ALL PRIVILEGES ON trpc_agent_mysql_migration_test.* TO 'trpc_migration'@'%';
            FLUSH PRIVILEGES;"
          mysql --protocol=tcp -h 127.0.0.1 -P 3307 -uroot -pmysql -e "
            SET GLOBAL log_bin_trust_function_creators = 1;
            CREATE USER IF NOT EXISTS 'trpc_migration'@'%' IDENTIFIED BY 'mysql';
            CREATE USER IF NOT EXISTS 'trpc_app'@'%' IDENTIFIED BY 'mysql';
            GRANT ALL PRIVILEGES ON trpc_agent_mysql_repository_test.* TO 'trpc_migration'@'%';
            FLUSH PRIVILEGES;"
      - name: Prepare MySQL schemas and application grants
        run: |
          MYSQL_CONTROL_PLANE_MIGRATION_TEST_DSN="$MYSQL_CONTROL_PLANE_MIGRATION_TEST_DSN" \
            go test ./migrations -run '^TestMySQLControlPlaneMigrationLive$' -count=1
          MYSQL_CONTROL_PLANE_MIGRATION_TEST_DSN="$MYSQL_CONTROL_PLANE_REPOSITORY_MIGRATION_DSN" \
            go test ./migrations -run '^TestMySQLControlPlaneMigrationLive$' -count=1
          for table in tenant model_profile agent_app agent_app_revision agent_app_revision_tool backend_profile backend_profile_binding channel_binding tenant_status_change_outbox model_profile_change_outbox backend_profile_change_outbox agent_app_change_outbox channel_binding_change_outbox tenant_configuration_outbox; do
            mysql --protocol=tcp -h 127.0.0.1 -P 3307 -uroot -pmysql -e "GRANT SELECT, INSERT, UPDATE, DELETE ON trpc_agent_mysql_repository_test.${table} TO 'trpc_app'@'%';"
          done

      - name: Race test
        run: ./scripts/race.sh
