# Codecov status checks (shown on PRs). The repository-wide 85% target stays
# visible as a trend, while blocking path statuses apply an explicit floor to
# the two independently testable control-plane boundaries. PostgreSQL adapters
# are also exercised against a real PostgreSQL service in CI.
# The live example entrypoint is exercised only by the opt-in Telegram workflow;
# its credential-free unit tests cover the pure helpers and boundary setup.
ignore:
  - "examples/telegram-e2e/main.go"

coverage:
  status:
    project:
      default:
        target: 85% # repository-wide coverage trend
        threshold: 0%
        informational: true
      runtime-bootstrap:
        target: 80% # command wiring and runtime graph
        threshold: 0%
        paths:
          - "cmd/trpc-service/**"
          - "trpcservice/bootstrap/**"
      postgres-control-plane:
        target: 65% # PostgreSQL repositories and their SQL error boundaries
        threshold: 0%
        paths:
          - "trpcservice/storage/postgres/**"
    patch:
      default:
        target: 85% # repository-wide changed-line coverage trend
        threshold: 0%
        informational: true
      runtime-bootstrap:
        target: 80% # command wiring and runtime graph
        threshold: 0%
        paths:
          - "cmd/trpc-service/**"
          - "trpcservice/bootstrap/**"
      postgres-control-plane:
        target: 65% # PostgreSQL repositories and their SQL error boundaries
        threshold: 0%
        paths:
          - "trpcservice/storage/postgres/**"
