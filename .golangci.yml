version: "2"

linters:
  default: none
  enable:
    - govet
    - revive
    - gocyclo
    - gosec
    - ineffassign
  settings:
    gocyclo:
      min-complexity: 20
    revive:
      rules:
        - name: package-comments
        - name: exported
          arguments:
            - disable-stuttering-check
  exclusions:
    rules:
      # Function-scoped complexity baseline; remove entries as each function is split.
      - path: ^trpcservice/admin/api_test\.go$
        text: 'cyclomatic complexity .* of func `TestAdminHappyPathCoversResourceMutations`'
        linters: [gocyclo]
      - path: ^trpcservice/agent/runtime_test\.go$
        text: 'cyclomatic complexity .* of func `TestAgentExecutionSnapshotFreezesFactoryInputAndCacheIdentity`'
        linters: [gocyclo]
      - path: ^trpcservice/backend/backend_test\.go$
        text: 'cyclomatic complexity .* of func `TestProviderCatalogNilAndHelperBoundaries`'
        linters: [gocyclo]
      - path: ^trpcservice/backend/runtime_test\.go$
        text: 'cyclomatic complexity .* of func `TestBackendExecutionSnapshotFreezesFactoryInputAndCacheIdentity`'
        linters: [gocyclo]
      - path: ^trpcservice/bootstrap/bootstrap_test\.go$
        text: 'cyclomatic complexity .* of func `TestEnvironmentBootstrapRequiresExplicitConfigurationAndBuildsDependencies`'
        linters: [gocyclo]
      - path: ^trpcservice/bootstrap/restart_test\.go$
        text: 'cyclomatic complexity .* of func `TestRestartBootstrapRoundTrip`'
        linters: [gocyclo]
      - path: ^trpcservice/channels/fake_test\.go$
        text: 'cyclomatic complexity .* of func `(?:TestFakeCandidateResolverOwnsCandidateAndVerificationBoundaries|TestFakeCandidateResolverRejectsForgeryReplayAndLifecycleEdges)`'
        linters: [gocyclo]
      - path: ^trpcservice/channels/inmemory/edge_test\.go$
        text: 'cyclomatic complexity .* of func `TestInMemoryErrorAndClockBranches`'
        linters: [gocyclo]
      - path: ^trpcservice/channels/inmemory/fake_test\.go$
        text: 'cyclomatic complexity .* of func `TestFakeResolverIsCoveredInsideItsOwningPackage`'
        linters: [gocyclo]
      - path: ^trpcservice/channels/inmemory/inmemory_test\.go$
        text: 'cyclomatic complexity .* of func `TestRepositoryLifecycleExpectedVersionAndCandidateInvalidation`'
        linters: [gocyclo]
      - path: ^trpcservice/channels/integration_test\.go$
        text: 'cyclomatic complexity .* of func `TestFakeTrustedInboundRouteAndBindingAwareIdentity`'
        linters: [gocyclo]
      - path: ^trpcservice/channels/telegram/provider_integration_test\.go$
        text: 'cyclomatic complexity .* of func `TestTelegramProviderOutboxE2E`'
        linters: [gocyclo]
      - path: ^trpcservice/controlplane/postgres/integration_test\.go$
        text: 'cyclomatic complexity .* of func `TestPostgreSQLRepositories`'
        linters: [gocyclo]
      - path: ^trpcservice/controlplane/postgres/postgres_error_paths_test\.go$
        text: 'cyclomatic complexity .* of func `TestPostgreSQLRepositoriesMapDriverFailures`'
        linters: [gocyclo]
      - path: ^trpcservice/gateway/dispatch_test\.go$
        text: 'cyclomatic complexity .* of func `(?:TestDispatcherMaterializesDurableChannelReplyAndWorkerCompletesLifecycle|TestDispatcherDurableClaimReclaimsReceivedAndExpiredRunning)`'
        linters: [gocyclo]
      - path: ^trpcservice/model/inmemory/inmemory_test\.go$
        text: 'cyclomatic complexity .* of func `TestRepositoryTenantIsolationLifecycleAndDefensiveCopies`'
        linters: [gocyclo]
      - path: ^trpcservice/model/model_test\.go$
        text: 'cyclomatic complexity .* of func `(?:TestProviderConfigurationBoundaryNormalization|TestOptionSecretGenerationAndPrimitiveValidation)`'
        linters: [gocyclo]
      - path: ^trpcservice/model/repository_test\.go$
        text: 'cyclomatic complexity .* of func `TestPrepareProfileChangesValidateAuditAndLifecycleEvents`'
        linters: [gocyclo]
      - path: ^trpcservice/model/runtime_test\.go$
        text: 'cyclomatic complexity .* of func `TestModelExecutionSnapshotRejectsInvalidStatesAndInputs`'
        linters: [gocyclo]
      - path: ^trpcservice/runtime/runtime_test\.go$
        text: 'cyclomatic complexity .* of func `(?:TestRunnerExecutesFakeModelAndPersistsTenantScopedSession|TestTenantSessionServiceDelegatesEveryOperationAndScopesKeys)`'
        linters: [gocyclo]
      - path: ^trpcservice/runtime/storage/postgres/integration_test\.go$
        text: 'cyclomatic complexity .* of func `TestRuntimeStorePostgreSQLConformanceAndRestart`'
        linters: [gocyclo]
      - path: ^trpcservice/storage/postgres/postgres_unit_test\.go$
        text: 'cyclomatic complexity .* of func `TestPostgreSQLStoragePrimitives`'
        linters: [gocyclo]
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$
