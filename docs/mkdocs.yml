site_name: tRPC-Agent-Service
site_description: 基于 tRPC-Agent-Go 的多租户节点化 Agent 部署平台
site_url: https://xnlemon.github.io/trpc-agent-service/
repo_url: https://github.com/XnLemon/trpc-agent-service
repo_name: XnLemon/trpc-agent-service
edit_uri: edit/main/docs/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 项目架构:
      - 生产架构设计: architecture.md
      - 数据模型: data-model.md
      - Tenant 运行时边界: tenant-runtime-boundary.md
      - Channel Binding: channel-binding.md
  - 开发文档:
      - Agent App 模型: agent-app-model.md
      - Backend Profile 模型: backend-profile.md
      - Model Profile 与 Runner 链路: model-profile.md
      - Issue #71 Provider Registries: issue-71-provider-registries.md
      - Issue #69 Multi-tenant Bootstrap: issue-69-multi-tenant-bootstrap.md
      - Issue #72 Cache Invalidation: issue-72-cache-invalidation.md
      - Gateway、Execution Plan 与 HTTP/SSE: gateway.md
      - Telegram 长轮询 Adapter: telegram.md
      - 企业微信自建应用 Text Webhook: wecom.md
      - Tenant 运行时持久化: runtime-storage.md
      - PostgreSQL 控制面与启动装配: postgresql-control-plane.md
      - 可重启控制面与 Admin API: issue-41-runtime-bootstrap-admin-api.md
      - 首次运行初始化: issue-67-first-run-init.md
      - "Issue #50 Reliable Reply Delivery": issue-50-reliable-delivery.md
      - 租户审计与用量成本: audit-usage.md
      - 运行时可观测性契约: observability.md
  - 运维与验证:
      - 运维方案: ops.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.4/dist/mermaid.min.js
  - javascripts/mermaid-init.js
